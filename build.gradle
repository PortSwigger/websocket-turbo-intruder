plugins {
    id 'java'
}

group = 'net.portswigger'
version = '2.0.0'

repositories {
    mavenLocal()
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
//    compileOnly "net.portswigger.burp.extensions:montoya-api:${extender_version}"

    implementation (
            "net.portswigger.burp.extensions:montoya-api:${extender_version}",
            'org.python:jython-standalone:2.7.3',
            'com.fifesoft:rsyntaxtextarea:3.3.4',
            'com.fifesoft:autocomplete:3.3.1',
            'org.json:json:20241224',
            "org.eclipse.jetty:jetty-server:${jetty_version}",
            "org.eclipse.jetty:jetty-servlet:${jetty_version}"
    )

    testImplementation(
            "net.portswigger.burp.extensions:montoya-api:${extender_version}",
            'org.junit.jupiter:junit-jupiter:5.10.1',
            'org.assertj:assertj-core:3.24.2',
            'org.mockito:mockito-core:5.8.0'
    )
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes (
                'Main-Class': 'standalone.StandaloneWebSocketFuzzer',
                'implementation-version': "${version}",
        )
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
}